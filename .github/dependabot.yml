# Dependabot, tuned for low maintenance:
# - version updates: checked monthly, minor + patch grouped into one PR per ecosystem,
#   major versions come as separate PRs (they may need code changes)
# - security updates: opened as soon as an advisory is published, also grouped,
#   so a batch of advisories means one PR instead of ten
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Backend Python packages (backend/requirements.txt)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Frontend packages (frontend/package.json + yarn.lock)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
      frontend:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Base images in the root Dockerfile (node, python)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
